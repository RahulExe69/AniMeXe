[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animexe"
version = "0.1.0"
description = "Anime episode explanation automation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "scenedetect-headless>=0.7.1,<0.8.0",
  "google-genai>=2.25.0,<3.0",
  "requests>=2.32.3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
animexe = "animexe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live: real external-provider integration test (requires network and ffmpeg)",
]
