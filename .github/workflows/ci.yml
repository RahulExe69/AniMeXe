name: AniMeXe CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      - name: Install FFmpeg for live media verification
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Compile package
        run: python -m compileall -q src

      - name: Run tests, including live AnimeParadise episode verification
        run: python -m pytest -q
